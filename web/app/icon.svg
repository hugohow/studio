<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icône « Ampli éclair » : ampli de salle de répèt, éclair rock, voyant vert = c'est libre. -->
  <defs>
    <pattern id="grille" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#2d1f40"/>
      <rect width="6" height="16" fill="#3a2a52"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#7b2ff7"/>
  <!-- réduit à 90 % : reste dans la zone sûre des icônes « maskable » (Android les découpe en cercle) -->
  <g transform="translate(256 256) scale(.9) translate(-256 -256)">
    <rect x="92" y="108" width="328" height="300" rx="32" fill="#1a1026"/>
    <rect x="114" y="128" width="284" height="54" rx="14" fill="#fff4dc"/>
    <g fill="#1a1026">
      <circle cx="150" cy="155" r="14"/><circle cx="196" cy="155" r="14"/>
      <circle cx="242" cy="155" r="14"/><circle cx="288" cy="155" r="14"/>
    </g>
    <circle cx="364" cy="155" r="12" fill="#3ef0a0" filter="url(#glow)"/>
    <rect x="114" y="198" width="284" height="188" rx="18" fill="url(#grille)"/>
    <path d="M276 212L208 306H254L234 372L312 270H264Z" fill="#ffd23f" stroke="#1a1026" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
