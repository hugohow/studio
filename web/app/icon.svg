<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icône « Ampli éclair », couleurs du site : fond bleu (accent), éclair et voyant verts = c'est libre. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <pattern id="grille" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#243044"/>
      <rect width="6" height="16" fill="#2e3b52"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- réduit à 90 % : reste dans la zone sûre des icônes « maskable » (Android les découpe en cercle) -->
  <g transform="translate(256 256) scale(.9) translate(-256 -256)">
    <rect x="92" y="108" width="328" height="300" rx="32" fill="#1b2330"/>
    <rect x="114" y="128" width="284" height="54" rx="14" fill="#ffffff"/>
    <g fill="#1b2330">
      <circle cx="150" cy="155" r="14"/><circle cx="196" cy="155" r="14"/>
      <circle cx="242" cy="155" r="14"/><circle cx="288" cy="155" r="14"/>
    </g>
    <circle cx="364" cy="155" r="12" fill="#34d399" filter="url(#glow)"/>
    <rect x="114" y="198" width="284" height="188" rx="18" fill="url(#grille)"/>
    <path d="M276 212L208 306H254L234 372L312 270H264Z" fill="#34d399" stroke="#1b2330" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
