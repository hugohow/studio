name: Refresh slots

# Rafraîchit data/slots.json à intervalle régulier et pousse le résultat sur la
# branche `data` (jamais sur main : chaque push sur main crée un déploiement Vercel
# et sature le quota gratuit de 100/jour ; `web/vercel.json` désactive les
# déploiements de la branche `data`). Vercel lit le feed via FEED_URL (?ref=data) + ISR.
on:
  schedule:
    # Repo public => minutes Actions gratuites illimitées, donc 15 min OK.
    # ⚠️ Le schedule GitHub est best-effort : retards de 5-20 min possibles, voire run sauté.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # déclenchement manuel possible

permissions:
  contents: write

concurrency:
  group: refresh-slots
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Récupérer les créneaux
        run: node bin/fetch-slots.js --out data/slots.json --months 1

      - name: Pousser sur la branche data si changement
        run: |
          git config user.name "studio-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin data
          git worktree add ../feed -B data origin/data
          mkdir -p ../feed/data
          cp data/slots.json ../feed/data/slots.json
          cd ../feed
          git add data/slots.json
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "chore: refresh slots $(date -u +%FT%TZ)"
            git push origin data
          fi
